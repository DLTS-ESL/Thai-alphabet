<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thai Alphabet Adventure</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff7fb,
            #eef8ff
        );

    min-height: 100vh;

    color: #26324a;
}


/* =========================================
   MAIN APP
========================================= */

.app {
    max-width: 1250px;
    margin: auto;
    padding: 25px;
}


/* =========================================
   HEADER
========================================= */

.header {
    background: white;

    border-radius: 25px;

    padding: 20px 25px;

    box-shadow:
        0 7px 25px rgba(0,0,0,0.08);

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 18px;
}

.title {
    font-size: 32px;
    font-weight: 900;
}

.subtitle {
    margin-top: 5px;
    color: #71809a;
    font-size: 16px;
}


/* =========================================
   TIMER AREA
========================================= */

.controls {

    display: flex;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;

    justify-content: flex-end;
}

.timer {

    background: #f6f5ff;

    border: 2px solid #e5e3ff;

    border-radius: 16px;

    padding: 7px 14px;

    text-align: center;

    min-width: 100px;
}

.timerLabel {

    font-size: 11px;

    color: #777;

    font-weight: bold;

    text-transform: uppercase;
}

.time {

    font-size: 25px;

    font-weight: 900;

    font-variant-numeric: tabular-nums;
}


/* BUTTONS */

button {

    font-family: inherit;

    cursor: pointer;

    border: none;
}

.timerButton {

    padding: 10px 13px;

    border-radius: 12px;

    font-weight: bold;

    min-height: 42px;

    background: #f0f1f5;

    color: #26324a;
}

.startButton {

    background: #4caf72;

    color: white;
}

.resetTimer {

    background: #f0f1f5;

}


/* SHOW LETTERS */

.showLetters {

    background: #665cff;

    color: white;

    padding: 10px 16px;

    border-radius: 13px;

    font-weight: bold;

    min-height: 42px;
}


/* =========================================
   INSTRUCTION
========================================= */

.instruction {

    background: white;

    border-radius: 18px;

    padding: 14px 20px;

    margin-bottom: 18px;

    text-align: center;

    font-size: 18px;

    font-weight: bold;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.05);
}


/* =========================================
   ALPHABET GRID
========================================= */

.alphabetGrid {

    display: grid;

    grid-template-columns:
        repeat(11, 1fr);

    gap: 11px;
}


/* =========================================
   FLIP CARD
========================================= */

.flipCard {

    height: 125px;

    perspective: 1000px;

    cursor: pointer;

    background: transparent;

    padding: 0;

    transition: transform 0.2s ease;
}

.flipCard:hover {

    transform:
        translateY(-5px);
}


/* INNER */

.cardInner {

    position: relative;

    width: 100%;

    height: 100%;

    transition:
        transform 0.6s
        cubic-bezier(.2,.7,.2,1);

    transform-style: preserve-3d;
}


/* FLIPPED */

.flipCard.flipped
.cardInner {

    transform:
        rotateY(180deg);
}


/* =========================================
   CARD FRONT + BACK
========================================= */

.cardFace {

    position: absolute;

    width: 100%;

    height: 100%;

    backface-visibility: hidden;

    -webkit-backface-visibility: hidden;

    border-radius: 20px;

    background: white;

    border: 3px solid #e8eaf0;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.08);

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;
}


/* =========================================
   FRONT
========================================= */

.cardFront {

    font-size: 60px;

    font-weight: 900;

    color: #26324a;
}


/* LITTLE TAP INDICATOR */

.tapHint {

    position: absolute;

    bottom: 7px;

    font-size: 10px;

    color: #a0a6b2;

    font-weight: bold;
}


/* =========================================
   BACK
========================================= */

.cardBack {

    transform:
        rotateY(180deg);

    padding: 7px;

    overflow: hidden;
}


/* =========================================
   ILLUSTRATION
========================================= */

.picture {

    width: 68px;

    height: 68px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 52px;

    line-height: 1;

    margin-bottom: 3px;
}


/* WORD */

.word {

    font-size: 16px;

    font-weight: 900;

    color: #26324a;
}


/* =========================================
   BACKGROUND COLORS
========================================= */

.cardBack {

    background:
        linear-gradient(
            145deg,
            #fff,
            #f8f8ff
        );
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1050px) {

    .alphabetGrid {

        grid-template-columns:
            repeat(8, 1fr);

    }

}


@media (max-width: 700px) {

    .app {

        padding: 12px;

    }

    .header {

        flex-direction: column;

        text-align: center;

    }

    .controls {

        justify-content: center;

    }

    .title {

        font-size: 25px;

    }

    .alphabetGrid {

        grid-template-columns:
            repeat(5, 1fr);

        gap: 8px;

    }

    .flipCard {

        height: 105px;

    }

    .cardFront {

        font-size: 45px;

    }

    .picture {

        font-size: 40px;

        width: 52px;

        height: 52px;

    }

    .word {

        font-size: 12px;

    }

}


@media (max-width: 420px) {

    .alphabetGrid {

        grid-template-columns:
            repeat(4, 1fr);

    }

}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    .cardInner {

        transition: none;

    }

    .flipCard {

        transition: none;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- ======================================
     HEADER
======================================= -->

<div class="header">

    <div>

        <div class="title">
            🌈 Thai Alphabet Adventure
        </div>

        <div class="subtitle">
            แตะตัวอักษร แล้วค้นพบคำศัพท์!
        </div>

    </div>


    <div class="controls">


        <!-- TIMER -->

        <div class="timer">

            <div class="timerLabel">
                ⏱ Time
            </div>

            <div
                class="time"
                id="time"
            >
                00:00
            </div>

        </div>


        <button
            class="timerButton startButton"
            onclick="startTimer()"
        >
            ▶ Start
        </button>


        <button
            class="timerButton"
            onclick="pauseTimer()"
        >
            ⏸ Pause
        </button>


        <button
            class="timerButton resetTimer"
            onclick="resetTimer()"
        >
            🔄
        </button>


        <button
            class="showLetters"
            onclick="showAllLetters()"
        >
            Show Letters
        </button>


    </div>

</div>


<!-- ======================================
     INSTRUCTION
======================================= -->

<div class="instruction">

    👆 Click a letter to flip the card!

    <br>

    <small>
        Can you recognize all 44 Thai consonants?
    </small>

</div>


<!-- ======================================
     ALPHABET
======================================= -->

<div
    class="alphabetGrid"
    id="alphabetGrid"
></div>


</div>


<script>


/* =========================================
   THAI ALPHABET DATA
========================================= */

/*
    picture uses simple child-friendly symbols.

    These can later be replaced with
    proper illustrated SVG pictures.
*/

const thaiAlphabet = [

    ["ก", "ไก่", "🐔"],
    ["ข", "ไข่", "🥚"],
    ["ฃ", "ขวด", "🍾"],
    ["ค", "ควาย", "🐃"],
    ["ฅ", "คน", "🧑"],
    ["ฆ", "ระฆัง", "🔔"],

    ["ง", "งู", "🐍"],
    ["จ", "จาน", "🍽️"],
    ["ฉ", "ฉิ่ง", "🥁"],
    ["ช", "ช้าง", "🐘"],
    ["ซ", "โซ่", "⛓️"],
    ["ฌ", "เฌอ", "🌳"],

    ["ญ", "หญิง", "👩"],
    ["ฎ", "ชฎา", "👑"],
    ["ฏ", "ปฏัก", "🪄"],
    ["ฐ", "ฐาน", "🧱"],
    ["ฑ", "มณโฑ", "👸"],
    ["ฒ", "ผู้เฒ่า", "👴"],

    ["ณ", "เณร", "🧒"],
    ["ด", "เด็ก", "👦"],
    ["ต", "เต่า", "🐢"],
    ["ถ", "ถุง", "👜"],
    ["ท", "ทหาร", "🪖"],
    ["ธ", "ธง", "🚩"],

    ["น", "หนู", "🐭"],
    ["บ", "ใบไม้", "🍃"],
    ["ป", "ปลา", "🐟"],
    ["ผ", "ผึ้ง", "🐝"],
    ["ฝ", "ฝา", "🫙"],
    ["พ", "พาน", "🥣"],

    ["ฟ", "ฟัน", "🦷"],
    ["ภ", "สำเภา", "⛵"],
    ["ม", "ม้า", "🐴"],
    ["ย", "ยักษ์", "👹"],
    ["ร", "เรือ", "🚤"],
    ["ล", "ลิง", "🐒"],

    ["ว", "แหวน", "💍"],
    ["ศ", "ศาลา", "🏠"],
    ["ษ", "ฤๅษี", "🧙"],
    ["ส", "เสือ", "🐯"],
    ["ห", "หีบ", "📦"],
    ["ฬ", "จุฬา", "🪁"],

    ["อ", "อ่าง", "🛁"],
    ["ฮ", "นกฮูก", "🦉"]

];


/* =========================================
   CREATE CARDS
========================================= */

function createAlphabet() {

    const grid =
        document.getElementById(
            "alphabetGrid"
        );


    thaiAlphabet.forEach(
        (item, index) => {


        const card =
            document.createElement(
                "button"
            );


        card.className =
            "flipCard";


        card.type =
            "button";


        card.setAttribute(
            "aria-label",
            item[0] + " " + item[1]
        );


        card.innerHTML = `

            <div class="cardInner">


                <!-- FRONT -->

                <div class="cardFace cardFront">

                    ${item[0]}

                    <div class="tapHint">
                        TAP ME!
                    </div>

                </div>


                <!-- BACK -->

                <div class="cardFace cardBack">

                    <div class="picture">

                        ${item[2]}

                    </div>

                    <div class="word">

                        ${item[1]}

                    </div>

                </div>


            </div>

        `;


        card.addEventListener(
            "click",
            function() {

                card.classList.toggle(
                    "flipped"
                );

            }
        );


        grid.appendChild(card);

    });

}


/* =========================================
   SHOW ALL LETTERS
========================================= */

function showAllLetters() {

    const cards =
        document.querySelectorAll(
            ".flipCard"
        );


    cards.forEach(
        card => {

            card.classList.remove(
                "flipped"
            );

        }
    );

}


/* =========================================
   TIMER
========================================= */

let seconds = 0;

let timer = null;


function formatTime(totalSeconds) {

    const minutes =
        Math.floor(
            totalSeconds / 60
        )
        .toString()
        .padStart(2, "0");


    const secs =
        (totalSeconds % 60)
        .toString()
        .padStart(2, "0");


    return (
        minutes +
        ":" +
        secs
    );

}


function updateTimer() {

    document.getElementById(
        "time"
    ).textContent =
        formatTime(seconds);

}


function startTimer() {

    if (timer !== null) {

        return;

    }


    timer =
        setInterval(
            function() {

                seconds++;

                updateTimer();

            },
            1000
        );

}


function pauseTimer() {

    if (timer !== null) {

        clearInterval(timer);

        timer = null;

    }

}


function resetTimer() {

    if (timer !== null) {

        clearInterval(timer);

        timer = null;

    }


    seconds = 0;

    updateTimer();

}


/* =========================================
   START APP
========================================= */

createAlphabet();

updateTimer();


</script>

</body>

</html>
